# Parámetros del robot. Todo lo ajustable vive acá (se documenta en el informe).

neck:
  # Límites articulares por software [grados]. Los topes mecánicos van un poco más allá.
  limits:
    yaw:   [-70.0, 70.0]
    pitch: [-20.0, 30.0]
    roll:  [-20.0, 20.0]
  home: [0.0, 0.0, 0.0]          # postura calibrada, mirada al frente
  vmax: [180.0, 120.0, 90.0]     # velocidad máxima por eje [°/s] (yaw, pitch, roll)
  amax: [600.0, 400.0, 300.0]    # aceleración máxima por eje [°/s²]
  # Calibración de los servos (planilla de pruebas_servos/README.md). La usa el firmware para pasar de grados a µs:
  # pulso = centro_us + signo · grados / grados_por_us, recortado a [min_us, max_us].
  servos:
    pitch:                       # Hitec HS-7955TG, medido el 09/10 (6 V, sin carga)
      centro_us: 1500
      grados_por_us: 0.090       # lineal y simétrico: ±45° en 1000/2000 µs
      min_us: 760                # límites electrónicos 750/2250 µs (≈ ±68°): ahí deja de moverse, sin forzar
      max_us: 2240
      signo: 1                   # pulso mayor = HORARIO visto de frente al eje: al revés que los RDS3218 (12/10,
                                 # comparado con el yaw, los dos ejes hacia el mismo lado y 1500 → 1700 µs).
                                 # FALTA: con el servo montado, qué sentido es "arriba"
    yaw:                         # DSSERVO RDS3218 n.º 2 (versión de 270°), medido el 12/10 sin carga
      centro_us: 1500
      grados_por_us: [0.13, 0.136]   # [lado de pulsos < 1500, lado de pulsos > 1500]. Medido: −39° en 1200,
                                     # −65° en 1000, −70° en 960; +39° en 1800, ≈ +67° en 2000, +75° en 2040
      min_us: 950                # ≈ −71°. No tiene tope (llega a −130° / +140° con 500/2500 µs):
      max_us: 2020               # ≈ +71°  estos límites son lo único que protege el cableado
      signo: 1                   # pulso mayor = antihorario visto de frente al eje (confirmado el 12/10 con 1700 µs).
                                 # FALTA: con el servo montado, qué sentido es "izquierda"
      # El n.º 1 (11-12/10) era simétrico: 0.13, 950/2050 µs. No son intercambiables sin recalibrar.
      # Antes: MG90S provisorio (09/10), asimétrico [0.090, 0.085], 600/2450 µs.
    roll:                        # TowerPro MG996R, medido el 13/10 a 6 V, sin carga
      centro_us: 1500
      grados_por_us: 0.092       # lineal y simétrico: ±55° en 900/2100 µs, ±64° en 800/2200 µs
      min_us: 1000               # ≈ ±46°: de sobra para los ±20° de roll (sin tope hasta 800/2300 µs)
      max_us: 2000
      signo: 1                   # FALTA: sentido de giro (no se anotó el 13/10) y, montado, qué sentido es "derecha"
      # Banda muerta GRANDE, ~100-110 µs (≈ 10°) e intermitente: de +10° a 0° no volvió en 3 de 10 intentos.
      # Pasos de 20° andan siempre. Conviene mandarle el objetivo de un solo movimiento, no acercarse de a poco.
      # Sin pulso queda flojo: en el STOP hay que seguir mandando el último pulso. Pesa 55 g.
      # Antes: MG90S (09-13/10, [0.090, 0.085], 1000/2000 µs, banda muerta 20-30 µs; queda de repuesto),
      # RDS3218 n.º 1 (descartado el 12/10: vibra quieto cerca de 1500 µs) y SG90 (repuesto).

serial:
  port: /dev/ttyACM0             # ESP32-S3 por USB nativo (CDC). Con conversor CH340/CP210x sería /dev/ttyUSB0
  baud: 115200
  watchdog_ms: 500               # ESP32: sin comandos → detiene secuencias y mantiene postura
  keepalive_ms: 200              # PC: envía PING si no mandó nada en este tiempo

camera:
  # Raspberry Pi 5 + Camera Module 3 NoIR (IMX708) en la cabeza.
  backend: auto                  # auto | ros2 | picamera2 | gstreamer | opencv  (en la Pi: ros2, ver config.local.yaml)
  ros_topic: /keepon_cam/image_raw   # tópico de camera_ros (backend ros2)
  index: 0                       # para opencv (webcam USB en la notebook de desarrollo)
  size: [640, 480]
  hfov_deg: 37.3                 # = 2·atan(320/fx). camera_ros a 640x480 RECORTA el sensor (no son los 66° nominales)
  # Intrínsecos de ~/vision_estereo/config/calibracion/right_corregida.yaml (cámara 0).
  # VERIFICAR que corresponden a la NoIR montada en la cabeza; recalibrar si se cambia de módulo o modo.
  fx: 948.16
  fy: 947.12
  cx: 428.50
  cy: 225.42
  dist: [-0.023288, 0.243119, -0.005078, -0.000387, 0.0]
  fps: 30

control:
  rate_hz: 40                    # lazo árbitro/control en la Pi

perception:
  max_age_s: 0.3                 # un mundo más viejo que esto se considera sin datos (cámara caída)
  yolo_model: models/yolo26n_256_ncnn_model
  yolo_imgsz: 256
  yolo_conf: 0.4
  max_persons: 3                 # rostros evaluados por cuadro (objetivo + candidatos)
  face_model: detector           # detector (BlazeFace, 6 puntos, rápido) | landmarker (478 puntos, ~49 ms/cara)
  face_crop_px: 192              # lado del recorte de cabeza que recibe el modelo de rostro
  pose_num: 2
  cores_personas: [0, 1]         # núcleos del proceso YOLO + rostros
  ncnn_threads: 2                # = cantidad de núcleos del proceso
  cores_pose: [2, 3]             # núcleos del proceso de pose
  pose_max_hz: 30                # limitar la pose libera memoria/CPU para YOLO (SALUDO dura >1 s)
  looking_deg: 15.0              # ME_MIRA: desvío cara->cámara menor a esto

# Duración de cada sonido [s]. El firmware es la fuente de verdad (manda DONE),
# la PC la usa para planificar y como timeout.
sounds:
  R2D2: 1.6
  POLCA: 6.0
  ABUCHEO: 2.5
  PIROPO: 1.2
  DESAPROBACION: 0.8
  BEEP_NEUTRO: 0.25
  BEEP_TIMIDO: 0.35
  BEEP_ATREVIDO: 0.35
  BEEP_MALEDUCADO: 0.45

# Tabla de prioridades (0 = más importante). Ver docs/HOJA_DE_RUTA.md §S4.
priorities:
  OPERADOR: 0
  SALUDO: 1
  CAMISETA: 2
  MODO: 3
  SEGUIMIENTO: 4
  OBSERVADOR: 5

# Periodos refractarios [s]. Se registran cuando la respuesta EMPIEZA, no al proponer.
cooldowns:
  SALUDO_por_persona: 5.0
  CAMISETA_por_persona: 25.0
  PIROPO_global: 40.0

# Control de mirada (T3): proporcional sin integral, en velocidad.
gaze:
  kp: 4.0                        # [1/s]  velocidad angular = kp * (|error| - zona muerta)
  vmax: [150.0, 90.0]            # saturación de velocidad de referencia (yaw, pitch) [°/s]
  deadzone: 0.03                 # zona muerta suave, fracción del ancho/alto de imagen
  ema: 0.5                       # suavizado del error (1 = sin filtro)
  lost_hold_s: 1.0               # pérdida < 1 s: mantener; luego se libera el objetivo

focus:
  switch_after_s: 1.5            # el candidato debe ser mejor durante este tiempo para cambiar
  w_looking: 1.0                 # ME_MIRA tiene prioridad estricta; este peso queda sin uso
  w_size: 0.6                    # pesos para desempatar dentro de cada grupo (T4)
  w_center: 0.4

observer:
  yaw_amp: 45.0                  # barrido lento
  pitch_amp: 6.0
  period_s: 14.0

greeting:
  nods: 3
  nod_amp: 12.0                  # [°] en pitch
  nod_period_s: 0.5
